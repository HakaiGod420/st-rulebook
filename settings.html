<div class="rb-settings" id="rb-settings">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>Rulebook — World Rules</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <label class="checkbox_label" for="rb-master">
            <input type="checkbox" id="rb-master">
            <span>Inject rules into the prompt</span>
        </label>
        <label class="checkbox_label" for="rb-hud-toggle">
            <input type="checkbox" id="rb-hud-toggle">
            <span>Show the rule chip in chat</span>
        </label>
        <div class="rb-settings-readout" id="rb-readout">—</div>
        <div class="menu_button menu_button_icon" id="rb-open">
            <i class="fa-solid fa-scale-balanced"></i>
            <span>Open rulebook</span>
        </div>
        <small class="rb-settings-hint">Rules are instructions about behaviour. Facts still belong in World Info.</small>
    </div>
</div>
